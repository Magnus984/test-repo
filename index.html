<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .todo-container { max-width: 400px; margin: 50px auto; }
        .todo-item { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .todo-item input[type="text"] { flex: 1; margin-right: 10px; }
    </style>
</head>
<body>
    <div class="todo-container">
        <h1>Todo App</h1>
        <div id="todo-list"></div>
        <input type="text" id="new-todo" placeholder="Add a new todo">
        <button onclick="addTodo()">Add</button>
    </div>

    <script>
        const todoList = document.getElementById('todo-list');
        const newTodoInput = document.getElementById('new-todo');

        function addTodo() {
            // I am Michael Addo
            const todoText = newTodoInput.value.trim();
            if (todoText === '') return;

            const todoItem = document.createElement('div');
            todoItem.className = 'todo-item';

            const todoTextInput = document.createElement('input');
            todoTextInput.type = 'text';
            todoTextInput.value = todoText;
            todoTextInput.readOnly = true;

            const deleteButton = document.createElement('button');
            deleteButton.textContent = 'Delete';
            deleteButton.onclick = () => todoItem.remove();

            todoItem.appendChild(todoTextInput);
            todoItem.appendChild(deleteButton);
            todoList.appendChild(todoItem);

            newTodoInput.value = '';
        }
    </script>
</body>
</html>
